<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Portadas Historias Destacadas Instagram</title>
  <style>
    @font-face {
      font-family: "Montserrat";
      src: url("/Users/documentos/Downloads/tuprofeindustrial-videos/src/tpi_videos/assets/fuentes/Montserrat-ExtraBold.ttf") format("truetype");
      font-weight: 800;
    }
    @font-face {
      font-family: "Montserrat";
      src: url("/Users/documentos/Downloads/tuprofeindustrial-videos/src/tpi_videos/assets/fuentes/Montserrat-SemiBold.ttf") format("truetype");
      font-weight: 600;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #060a12;
      font-family: "Montserrat", -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
      padding: 40px 0;
    }

    .cover-story {
      width: 1080px;
      height: 1920px;
      position: relative;
      background: #080F18;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Fondo técnico cuadriculado de ingeniería */
    .blueprint-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(56, 189, 248, 0.05) 1.5px, transparent 1.5px),
        linear-gradient(90deg, rgba(56, 189, 248, 0.05) 1.5px, transparent 1.5px);
      background-size: 60px 60px;
    }

    /* Brillo radial central */
    .glow {
      position: absolute;
      width: 800px;
      height: 800px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(11, 89, 97, 0.35) 0%, rgba(8, 15, 24, 0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    /* El círculo exacto que se ve en el perfil de Instagram (1080x1080 centrado) */
    .safe-circle {
      position: absolute;
      width: 620px;
      height: 620px;
      border-radius: 50%;
      border: 3px solid rgba(183, 247, 232, 0.25);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle, #0c1a29 0%, #07121e 100%);
      box-shadow: 0 0 60px rgba(11, 89, 97, 0.4), inset 0 0 40px rgba(0, 0, 0, 0.6);
    }

    .inner-circle {
      position: absolute;
      width: 580px;
      height: 580px;
      border-radius: 50%;
      border: 1px dashed rgba(245, 185, 66, 0.4);
      animation: rotate 60s linear infinite;
    }

    .icon-box {
      width: 220px;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
    }

    .icon-box svg {
      width: 100%;
      height: 100%;
    }

    .title {
      font-size: 42px;
      font-weight: 800;
      color: #F8FAFC;
      letter-spacing: 4px;
      text-transform: uppercase;
      text-align: center;
      text-shadow: 0 4px 12px rgba(0,0,0,0.8);
    }

    .subtitle {
      font-size: 22px;
      font-weight: 600;
      color: #F5B942;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 10px;
    }

    /* Rótulos superior e inferior tipo plano */
    .top-badge {
      position: absolute;
      top: 260px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 24px;
      background: rgba(18, 27, 47, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 40px;
      font-size: 20px;
      color: #38BDF8;
      letter-spacing: 2px;
      font-weight: 600;
    }

    .bot-brand {
      position: absolute;
      bottom: 260px;
      font-size: 24px;
      font-weight: 800;
      color: rgba(248, 250, 252, 0.4);
      letter-spacing: 4px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <!-- 1. QUIÉN SOY -->
  <div id="story-quien-soy" class="cover-story">
    <div class="blueprint-grid"></div>
    <div class="glow"></div>
    <div class="top-badge">⚙️ TUPROFEINDUSTRIAL</div>
    <div class="safe-circle">
      <div class="inner-circle"></div>
      <div class="icon-box">
        <svg viewBox="0 0 100 100" fill="none">
          <circle cx="50" cy="50" r="18" fill="#080F18" stroke="#F5B942" stroke-width="4"/>
          <path d="M50 15V23M50 77V85M15 50H23M77 50H85M25 25L31 31M69 69L75 75M25 75L31 69M69 31L75 25" stroke="#B7F7E8" stroke-width="5" stroke-linecap="round"/>
          <circle cx="50" cy="50" r="32" stroke="#B7F7E8" stroke-width="4" stroke-dasharray="6 4"/>
          <circle cx="50" cy="50" r="8" fill="#F5B942"/>
        </svg>
      </div>
      <div class="title">¿QUIÉN SOY?</div>
      <div class="subtitle">INGENIERO INDUSTRIAL</div>
    </div>
    <div class="bot-brand">HISTORIA DESTACADA</div>
  </div>

  <!-- 2. TUTORÍAS -->
  <div id="story-tutorias" class="cover-story">
    <div class="blueprint-grid"></div>
    <div class="glow" style="background: radial-gradient(circle, rgba(245, 185, 66, 0.25) 0%, rgba(8, 15, 24, 0) 70%);"></div>
    <div class="top-badge">📐 PROGRAMAS OFICIALES</div>
    <div class="safe-circle">
      <div class="inner-circle"></div>
      <div class="icon-box">
        <svg viewBox="0 0 100 100" fill="none">
          <!-- Escuadra de ingeniería -->
          <path d="M22 80V20L82 80H22Z" fill="rgba(11,89,97,0.3)" stroke="#38BDF8" stroke-width="4"/>
          <path d="M34 70V44L60 70H34Z" stroke="#F8FAFC" stroke-width="3"/>
          <line x1="22" y1="30" x2="28" y2="30" stroke="#38BDF8" stroke-width="3"/>
          <line x1="22" y1="40" x2="30" y2="40" stroke="#38BDF8" stroke-width="3"/>
          <line x1="22" y1="50" x2="28" y2="50" stroke="#38BDF8" stroke-width="3"/>
          <line x1="22" y1="60" x2="30" y2="60" stroke="#38BDF8" stroke-width="3"/>
          <line x1="22" y1="70" x2="28" y2="70" stroke="#38BDF8" stroke-width="3"/>
          <circle cx="75" cy="25" r="8" fill="#F5B942"/>
          <path d="M68 32L60 40" stroke="#F5B942" stroke-width="4" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="title">TUTORÍAS</div>
      <div class="subtitle">MEDIA · PAES · UNIVERSIDAD</div>
    </div>
    <div class="bot-brand">HISTORIA DESTACADA</div>
  </div>

  <!-- 3. RESULTADOS -->
  <div id="story-resultados" class="cover-story">
    <div class="blueprint-grid"></div>
    <div class="glow" style="background: radial-gradient(circle, rgba(34, 197, 94, 0.25) 0%, rgba(8, 15, 24, 0) 70%);"></div>
    <div class="top-badge">⭐ CASOS DE ÉXITO</div>
    <div class="safe-circle">
      <div class="inner-circle"></div>
      <div class="icon-box">
        <svg viewBox="0 0 100 100" fill="none">
          <!-- Trofeo y gráfica ascendente -->
          <path d="M28 28H72V48C72 60 62 70 50 70C38 70 28 60 28 48V28Z" fill="rgba(245,185,66,0.15)" stroke="#F5B942" stroke-width="4"/>
          <path d="M28 36H18C14 36 12 40 12 44C12 52 18 56 28 56" stroke="#F5B942" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M72 36H82C86 36 88 40 88 44C88 52 82 56 72 56" stroke="#F5B942" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M50 70V82M36 82H64" stroke="#F5B942" stroke-width="4" stroke-linecap="round"/>
          <path d="M42 48L48 54L58 42" stroke="#22C55E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="title">RESULTADOS</div>
      <div class="subtitle">ALUMNOS Y NOTAS</div>
    </div>
    <div class="bot-brand">HISTORIA DESTACADA</div>
  </div>

  <!-- 4. SIMULADORES / WEB -->
  <div id="story-simuladores" class="cover-story">
    <div class="blueprint-grid"></div>
    <div class="glow" style="background: radial-gradient(circle, rgba(56, 189, 248, 0.3) 0%, rgba(8, 15, 24, 0) 70%);"></div>
    <div class="top-badge">💻 PLATAFORMA WEB</div>
    <div class="safe-circle">
      <div class="inner-circle"></div>
      <div class="icon-box">
        <svg viewBox="0 0 100 100" fill="none">
          <!-- Laptop con gráfica -->
          <rect x="20" y="24" width="60" height="42" rx="4" fill="rgba(8,44,52,0.4)" stroke="#38BDF8" stroke-width="4"/>
          <line x1="12" y1="74" x2="88" y2="74" stroke="#38BDF8" stroke-width="5" stroke-linecap="round"/>
          <path d="M30 54L42 42L52 50L68 34" stroke="#B7F7E8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="68" cy="34" r="3.5" fill="#F5B942"/>
        </svg>
      </div>
      <div class="title">SIMULADOR</div>
      <div class="subtitle">WEB & CALCULADORAS</div>
    </div>
    <div class="bot-brand">HISTORIA DESTACADA</div>
  </div>

</body>
</html>
