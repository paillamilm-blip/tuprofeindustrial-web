  wa1: `¡Hola! Con gusto te apoyo. La tutoría personalizada de 1 hora tiene un valor de $20.000 CLP (online o a domicilio en Santiago). ¿Qué día y horario te acomoda?`,
  wa2: `¡Hola! Para la recta final te recomiendo el Pack PAES: 6 horas de tutorías personalizadas intensivas por $100.000 CLP (ahorras $20.000). Trabajamos ensayos y trampas DEMRE. ¿Agendamos la primera sesión?`,
  wa3: `¡Hola! El Intensivo de Ingeniería incluye 36 horas mensuales de Cálculo, Álgebra y Nivelación por $600.000 CLP/mes con soporte continuo por WhatsApp. Cuéntame qué ramos cursas.`,
};

let currentTab = "dia";
let currentDay = "mie25";

function getSantiagoNow() {
  const now = new Date();
  const iso = new Intl.DateTimeFormat("en-CA", { timeZone: "America/Santiago", year: "numeric", month: "2-digit", day: "2-digit" }).format(now);
  const parts = new Intl.DateTimeFormat("en-GB", { timeZone: "America/Santiago", hour: "2-digit", minute: "2-digit", hour12: false }).formatToParts(now);
  const hh = Number(parts.find(p => p.type === "hour")?.value || 12);
  const mm = Number(parts.find(p => p.type === "minute")?.value || 0);
  return { iso, mins: hh * 60 + mm, timeStr: `${String(hh).padStart(2, "0")}:${String(mm).padStart(2, "0")}` };
}

function diffDays(fromIso, toIso) {
  return Math.max(0, Math.round((Date.parse(toIso + "T00:00:00Z") - Date.parse(fromIso + "T00:00:00Z")) / 86400000));
}

function loadState(day) {
  try {
    const raw = localStorage.getItem("tpi_tracking_" + day);
    if (raw) return JSON.parse(raw);
  } catch {}
  return day === "mie25" ? { "mie-1230-video": true, "mie-1300-story": true } : {};
}

function saveState(day, state) {
  try { localStorage.setItem("tpi_tracking_" + day, JSON.stringify(state)); } catch {}
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2000);
}

function toggleTask(taskId) {
  const state = loadState(currentDay);
  state[taskId] = !state[taskId];
  saveState(currentDay, state);
  showToast(state[taskId] ? "✅ Marcado como listo" : "↺ Devuelto a pendiente");
  renderAll();
}

function copyVal(key) {
  const text = COPIES[key];
  if (!text) return;
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => showToast("📋 ¡Copiado al portapapeles!")).catch(() => fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  document.execCommand("copy");
  document.body.removeChild(ta);
  showToast("📋 ¡Copiado al portapapeles!");
}

function switchTab(tab) {
  currentTab = tab;
  ["dia", "productos", "semana", "proyectos"].forEach((t, i) => {
    document.getElementById("view-" + t).style.display = t === tab ? "block" : "none";
    document.querySelectorAll(".tab-btn")[i].classList.toggle("active", t === tab);
  });
  document.getElementById("day-switcher").style.display = (tab === "dia" || tab === "productos") ? "grid" : "none";
}

function switchDay(day) {
  currentDay = day;
  document.querySelectorAll(".day-btn")[0].classList.toggle("active", day === "mie25");
  document.querySelectorAll(".day-btn")[1].classList.toggle("active", day === "jue26");
  renderAll();
}

function renderAll() {
  const now = getSantiagoNow();
  document.getElementById("clock-clt").textContent = now.timeStr + " CLT";

  const dayObj = DAYS[currentDay];
  const state = loadState(currentDay);
  const tasks = dayObj.tasks;

  const isUrgent = (t) => {
    if (state[t.id]) return false;
    if (dayObj.iso < now.iso) return true;
    if (dayObj.iso > now.iso) return false;
    return t.mins <= now.mins + 45;

    priorityHtml = `<div class="card-priority done"><div style="font-weight:900; color:#166534;">🟢 ¡${dayObj.label} 100% COMPLETADO!</div></div>`;

        ${nextTask.mp4 ? `<a href="${nextTask.mp4}" download target="_blank" rel="noopener noreferrer" class="btn btn-dark">🎬 Bajar Video MP4 al Celular</a>` : ""}
        ${nextTask.openUrl ? `<a href="${nextTask.openUrl}" target="_blank" rel="noopener noreferrer" class="btn" style="background:#4f46e5; border-color:#4f46e5; color:#fff;"><span>👥 Abrir Grupos PAES en Facebook</span><span>↗</span></a>` : ""}
        ${nextTask.waShare ? `<a href="https://wa.me/?text=${encodeURIComponent(copyTxt)}" target="_blank" rel="noopener noreferrer" class="btn btn-wa"><span>💬 Abrir WhatsApp y Enviar</span><span>↗</span></a>` : ""}
        ${nextTask.copyKey ? `<button type="button" class="btn ${urg ? "btn-red" : ""}" onclick="copyVal('${nextTask.copyKey}')"><span>📋 Copiar Texto / Copy</span><span>COPIAR</span></button>` : ""}
        <button type="button" class="btn" style="justify-content:center; border:2px solid #16a34a; color:#166534;" onclick="toggleTask('${nextTask.id}')">✓ Marcar como subida</button>
      </div>`;
  }

  const tasksHtml = tasks.map(t => {
    const done = !!state[t.id];
    const urg = isUrgent(t);
    const copyTxt = t.copyKey ? COPIES[t.copyKey] : "";
    return `
      <div class="task-item ${done ? "done" : urg ? "urgent" : ""}">
        <div style="display:flex; justify-content:space-between; align-items:center; gap:6px;">
          <div style="display:flex; gap:6px; align-items:center; flex-wrap:wrap;">
            <span style="font-size:11px; font-weight:800; font-family:monospace;">${t.time}</span>
            <span class="tag tag-${t.cat}">${t.cat}</span>
            <span style="font-size:10px; font-weight:700; color:#64748b;">${done ? "🟢 Listo" : urg ? "🔴 Alerta" : "🟡 Proceso"}</span>
          </div>
          <button type="button" class="chk-btn ${done ? "checked" : ""}" onclick="toggleTask('${t.id}')">${done ? "✓ Subido" : "⬜ Marcar"}</button>
        </div>
        <div class="task-title">${t.title}</div>
        <div class="task-desc">${t.desc}</div>
        ${!done && t.waShare ? `<a href="https://wa.me/?text=${encodeURIComponent(copyTxt)}" target="_blank" rel="noopener noreferrer" class="btn btn-wa" style="min-height:40px; padding:8px 10px; font-size:11px;"><span>💬 Abrir WhatsApp y Enviar</span><span>↗</span></a>` : ""}
        ${!done && t.copyKey ? `<button type="button" class="btn" style="min-height:40px; padding:8px 10px; font-size:11px;" onclick="copyVal('${t.copyKey}')"><span>📋 Copiar texto</span><span>Copiar</span></button>` : ""}
      </div>`;

  document.getElementById("view-dia").innerHTML = `

      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
        <span style="font-size:12px; font-weight:800;">${dayObj.label}: ${doneCount}/${tasks.length}</span>

      <a href="https://wa.me/?text=${encodeURIComponent(COPIES.wa2)}" target="_blank" rel="noopener noreferrer" class="btn btn-green"><span>💬 Enviar Pack PAES ($100k) por WA</span><span>↗</span></a>

  const videosHtml = dayObj.videos.map(v => `

  const carHtml = dayObj.carousels.map(c => `

  document.getElementById("view-productos").innerHTML = `
    <div class="card" style="background:#eff6ff; border-color:#2563eb; margin-bottom:2px;">
      <div style="font-size:12.5px; font-weight:900; color:#1e3a8a;">📄 Formulario Maestro de Ingeniería (PDF)</div>
      <div style="font-size:11px; color:#1e40af; margin-top:2px;">Nuevo 20:01 hrs · Cuadrática, Discriminante, Viète y Geometría 3D</div>
      <a href="/formulario_maestro_ingenieria.pdf" download target="_blank" rel="noopener noreferrer" class="btn" style="background:#2563eb; border-color:#2563eb; color:#fff; justify-content:center; margin-top:8px;">⬇ Abrir / Bajar Formulario PDF</a>
    </div>

      <div style="font-size:12px; font-weight:900; color:#14532d;">📄 Simulacro PAES M1 con Solucionario (PDF)</div>
      <div style="font-size:11px; color:#166534; margin-top:2px;">20 ítems de alternativas con solucionario paso a paso</div>
      <a href="/simulacro-paes-m1.pdf" download target="_blank" rel="noopener noreferrer" class="btn btn-green" style="justify-content:center; margin-top:8px;">⬇ Bajar Simulacro PDF</a>
    </div>
    <div class="card"><div style="font-size:12px; font-weight:800; margin-bottom:8px;">🎬 Videos MP4 y Portadas (${dayObj.label})</div>${videosHtml}</div>
    ${carHtml}

  document.getElementById("view-semana").innerHTML = `
    <div class="card">
      <div style="font-size:12px; font-weight:800; text-transform:uppercase; margin-bottom:8px;">Semana 2 (23–29 Nov)</div>
      <div style="font-size:11.5px; display:flex; flex-direction:column; gap:8px;">
        <div style="padding:8px; background:#f8fafc; border-radius:6px;"><b>Lun 23 (Completado):</b> (x+2)/2 · 1m²=100cm² · i²=-1</div>
        <div style="padding:8px; background:#f8fafc; border-radius:6px;"><b>Mar 24 (Completado):</b> x²=25 · Vértice · ¿Por qué π?</div>
        <div style="padding:8px; background:#fef2f2; border:1px solid #ef4444; border-radius:6px;"><b>Mié 25:</b> Discriminante · Arista 3D · Dividir por 0 <button type="button" class="btn" style="min-height:36px; margin-top:6px; justify-content:center;" onclick="switchDay('mie25'); switchTab('dia')">Abrir Miércoles →</button></div>
        <div style="padding:8px; background:#eff6ff; border:1px solid #93c5fd; border-radius:6px;"><b>Jue 26 (Calibrado 8 Láminas):</b> Parábola-Recta · Viète · Euler <button type="button" class="btn" style="min-height:36px; margin-top:6px; justify-content:center;" onclick="switchDay('jue26'); switchTab('dia')">Abrir Jueves →</button></div>
        <div style="padding:8px; background:#fff; border:1px solid #e2e8f0; border-radius:6px;"><b>Vie 27 – Dom 29:</b> Inecuaciones · Inversa · Ritual Calma PAES</div>
      </div>
    </div>`;

  const fondos = [
    { name: "PAES Regular 2026", iso: "2026-11-30", monto: "Ingreso U 2027", urgent: true },
    { name: "CORFO: Semilla Inicia", iso: "2027-03-20", monto: "$15.000.000 CLP" },
    { name: "Start-Up Chile: Build", iso: "2027-04-15", monto: "$15.000.000 CLP" },
    { name: "Sercotec: Capital Semilla", iso: "2027-04-25", monto: "$3.500.000 CLP" },
    { name: "Santander X Award", iso: "2027-05-01", monto: "Capital + Aceleración" },
  ];
  document.getElementById("view-proyectos").innerHTML = `
    <div class="card">
      <div style="font-size:12px; font-weight:800; text-transform:uppercase; margin-bottom:8px;">Radar de Proyectos y Fondos</div>
      ${fondos.map(f => `<div style="padding:10px; border:1px solid ${f.urgent ? "#fca5a5" : "#e2e8f0"}; background:${f.urgent ? "#fef2f2" : "#f8fafc"}; border-radius:8px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center;"><div><div style="font-size:12px; font-weight:800;">${f.name}</div><div style="font-size:10.5px; color:#64748b;">${f.monto} · ${f.iso}</div></div><span style="font-family:monospace; font-weight:900; color:${f.urgent ? "#dc2626" : "#16a34a"};">${diffDays(now.iso, f.iso)} DÍAS</span></div>`).join("")}
    </div>`;
}

if (getSantiagoNow().iso >= "2026-11-26") {
  currentDay = "jue26";
  document.querySelectorAll(".day-btn")[0].classList.remove("active");
  document.querySelectorAll(".day-btn")[1].classList.add("active");
}
renderAll();
</script>
